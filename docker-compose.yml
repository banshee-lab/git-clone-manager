services:
  gitsync:
    network_mode: host
    build:
      context: .
    image: gitsync:dev
    environment:
      GITSYNC_SERVER_BASE_URL: http://localhost:8080
      GITSYNC_OIDC_ISSUER_URL: http://localhost:5556/default
      GITSYNC_OIDC_CLIENT_ID: gitsync
      GITSYNC_OIDC_CLIENT_SECRET: gitsync-dev-secret
      GITSYNC_OIDC_SESSION_SECRET: gitsync-development-session-secret-change-me
      # GITSYNC_NOTIFICATIONS_TELEGRAM_BOT_TOKEN: ""
      # GITSYNC_NOTIFICATIONS_TELEGRAM_CHAT_ID: ""
      # GITSYNC_NOTIFICATIONS_WEBHOOK_URL: ""
      # GITSYNC_NOTIFICATIONS_WEBHOOK_SECRET: ""
    volumes:
      - gitsync-data:/data
      - gitsync-repos:/repos
      # Optional: keep logs outside /data while retaining a separate named volume.
      # - gitsync-logs:/logs
      # For post commands that use Docker Compose, enable this socket mount.
      # - /var/run/docker.sock:/var/run/docker.sock
    # Set this with the optional volume above:
    # environment:
    #   GITSYNC_STORAGE_LOGS_DIR: /logs
    # When the socket mount is enabled, set its group ID like this:
    # group_add:
    #   - "${DOCKER_GID}"
    depends_on:
      mock-oauth2-server:
        condition: service_started
    # On openSUSE 16, uncomment when mounting docker.sock under SELinux:
    # security_opt:
    #   - label=disable

  mock-oauth2-server:
    network_mode: host
    image: ghcr.io/navikt/mock-oauth2-server:2.3.0
    environment:
      SERVER_PORT: 5556
      JSON_CONFIG_PATH: /app/config.json
    volumes:
      - ./deploy/mock-oauth2-server/config.json:/app/config.json:ro

volumes:
  gitsync-data:
  gitsync-repos:
  # gitsync-logs:
