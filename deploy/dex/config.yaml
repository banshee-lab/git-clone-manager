issuer: http://dex:5556/dex
storage:
  type: memory
web:
  http: 0.0.0.0:5556
oauth2:
  skipApprovalScreen: true
enablePasswordDB: true
staticClients:
  - id: gitsync
    name: GitSync local development
    secret: gitsync-dev-secret
    redirectURIs:
      - http://localhost:8080/auth/callback
staticPasswords:
  - email: admin@example.com
    # bcrypt hash for the local development password; generate your own with
    # `docker run --rm httpd:alpine htpasswd -bnBC 10 "" password | tr -d ':\n'`.
    hash: "$2y$10$.ZFzLNOlF2lF9SKe6Uw/denqh4xq4kUbM0m7kEwfZbKs.jqDd9wM6"
    username: admin
    userID: "08a8684b-db88-4b73-90a9-3cd1661f5466"
